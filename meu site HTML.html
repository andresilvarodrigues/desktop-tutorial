<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stilo do site.css">
    <title>Login - GameZone</title>
</head>

<body>
    <header>
    
        <h1>GameZone</h1>
        <p>Sua loja de jogos favorita!</p>
    </header>

    <main>

        <section>
            <h2>Bem-vindo à GameZone</h2>
            <p>
                Entre na sua conta para acessar seus jogos,
                promoções e ofertas exclusivas.
            </p>
        </section>

        <section>
            <h2>Login</h2>

            <form>
                <label for="usuario">Usuário:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário">

                <br><br>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha">

                <br><br>

                <button type="submit">Entrar</button>
            </form>
        </section>

        <section>
            <h2>Ainda não possui uma conta?</h2>
            <p>
                Crie sua conta gratuitamente e aproveite
                nossas ofertas de jogos.
            </p>

            <button type="button">Criar conta</button>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 GameZone - Loja de Jogos</p>
    </footer>

</body>
</html>
